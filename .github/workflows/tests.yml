name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
        # Trained models and processed data are gitignored by design (see
        # backend/models/*.keras|*.pkl and data/raw|processed in .gitignore)
        # -- reproducible locally via train/*.py, not committed. The tests
        # that need them auto-skip here with a clear reason (see
        # tests/conftest.py) rather than failing; this workflow is
        # intentionally checking the pure-logic agents plus every endpoint's
        # request validation and error handling on every push.
